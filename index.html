<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImmoText - Accedi alla Piattaforma</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex items-center justify-center overflow-hidden">

    <!-- Card di Login Centrale -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl relative">
        
        <!-- Logo e Titolo -->
        <div class="text-center mb-8">
            <div class="inline-flex bg-indigo-600 p-3 rounded-2xl text-white shadow-lg shadow-indigo-600/30 mb-4">
                <i data-lucide="sparkles" class="w-7 h-7"></i>
            </div>
            <h1 class="font-bold text-2xl tracking-wide text-white">ImmoText</h1>
            <p class="text-xs text-indigo-400 font-medium mt-1">L'Intelligenza Artificiale per Agenti Immobiliari</p>
        </div>

        <!-- Form di Accesso -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Email Professionale</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="email" id="login-email" required placeholder="agente@immobiliare.it" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-lg shadow-indigo-600/20 mt-2">
                Accedi alla Dashboard <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Divisore -->
        <div class="relative my-6 text-center">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
            <span class="relative bg-slate-900 px-3 text-xs text-slate-500 uppercase tracking-wider">oppure</span>
        </div>

        <!-- Login Social / Supabase Ready -->
        <button onclick="handleLogin(event)" class="w-full bg-slate-950 hover:bg-slate-800/80 border border-slate-800 text-slate-200 font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition text-sm">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Accedi con Google
        </button>

        <p class="text-center text-xs text-slate-500 mt-6">
            Accesso riservato alle agenzie partner del programma Beta.
        </p>
    </div>

    <!-- Script di reindirizzamento al generatore -->
    <script>
        lucide.createIcons();

        function handleLogin(e) {
            e.preventDefault();
            // Qui in futuro collegherai Supabase Auth. 
            // Per adesso, reindirizza direttamente alla pagina del generatore che abbiamo creato prima!
            window.location.href = "generator.html";
        }
    </script>
</body>
</html>
